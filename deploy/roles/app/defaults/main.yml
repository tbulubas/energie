# The Energie web app on the same machine as the collector. Off unless the inventory sets
# energie_app_enabled: true.
energie_app_enabled: false

app_dir: /opt/energie-app                  # code and virtual environment (read-only for the service)
app_data_dir: /var/lib/energie             # energie.db, photos, screenshots
app_db: "{{ app_data_dir }}/energie.db"
app_port: 8510
# The app has no authentication: 0.0.0.0 makes it reachable in the home network. Never forward
# this port to the internet; 127.0.0.1 keeps it on the Pi itself.
app_host: 0.0.0.0

# Ollama with Gemma on another computer, e.g. http://192.168.178.40:11434 (its firewall should allow
# only this Pi). Empty: no Gemma; numbers, charts and the sync work all the same.
app_ollama_url: ""
app_gemma_model: ""                        # empty: the app's default model

# The package in this checkout that is installed on the Pi.
app_src_root: "{{ playbook_dir | dirname }}/src/energie"
