# Turns a clean Raspberry Pi OS Lite (or Armbian on the Odroid) into the Energie collector:
# system updates, time zone, the collector as a systemd service and a nightly database backup.
# Run it again after every change (it only changes what differs):
#
#   make deploy                                   (Windows: runs ansible-playbook in WSL)
#   ansible-playbook -i inventory.yml site.yml    (from this folder on Linux/macOS/WSL)

- name: Energie collector
  hosts: collector
  become: true
  roles:
    - base
    - collector
    - backup
